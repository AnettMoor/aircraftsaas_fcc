# =====================================================================
# Aircraft SaaS — Ingress routing.
#
# Each service gets its own subdomain instead of a path prefix.
# Rationale:
#   * The previous design used `path: /api/users(/|$)(.*)` with
#     `nginx.ingress.kubernetes.io/rewrite-target: /$2`, but the .NET
#     controllers are mounted at `api/v{version}/...`, so a request to
#     `/api/users/v1/identity/account/login` was being rewritten to
#     `/v1/identity/account/login` and returned 404 from the upstream.
#   * Host-based routing requires zero rewrites: the request that
#     arrives at the upstream is byte-for-byte the request the .NET
#     app already knows how to route.
#   * Hostnames use placeholder `*.aircraft.localtest.me` in the base
#     and are rewritten to `*.aircraft.example.com` by the OpenNebula
#     overlay (k8s/overlays/opennebula/kustomization.yaml).
#
# Each Ingress object lives in the SAME namespace as its backend
# Service, because Kubernetes Ingress backends cannot reference a
# Service in another namespace.
#
# =====================================================================
# Phase C §C.15 additions on every Ingress below:
#
#   * `cert-manager.io/cluster-issuer: letsencrypt-staging` —
#     promote to `letsencrypt-prod` once the edge DNS is stable.
#     cert-manager populates the `<host>-tls` Secret named in
#     `spec.tls[*].secretName`.
#   * `nginx.ingress.kubernetes.io/ssl-redirect: "true"` — force HTTPS.
#   * `nginx.ingress.kubernetes.io/hsts: "true"` + `hsts-max-age` —
#     browsers refuse plain-HTTP for the host for a year.
#   * `nginx.ingress.kubernetes.io/configuration-snippet:` —
#     X-Frame-Options DENY, nosniff, Referrer-Policy, CSP.
# =====================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: users-ingress
  namespace: ns-users
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; frame-ancestors 'none'";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [users.aircraft.localtest.me]
      secretName: users-tls
  rules:
  - host: users.aircraft.localtest.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: users-service
            port: { number: 8080 }
