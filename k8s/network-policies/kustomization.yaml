# NetworkPolicy component kustomization.
#
# All policies share a single `kustomize` root so the base/overlay
# wiring in k8s/base/kustomization.yaml picks them up in one line.
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - default-deny.yaml
  - allow-users.yaml
  - allow-fleet.yaml
  - allow-booking.yaml
  - allow-infra.yaml
  - allow-frontend.yaml
  - allow-registry.yaml
