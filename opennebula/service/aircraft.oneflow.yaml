# =====================================================================
# OneFlow service template -- orchestrates the 3-VM cluster as a single
# logical object.
#
# This YAML file is the human-readable source. It is NOT consumed
# directly by `oneflow-template create` -- that command requires JSON
# (it errors with "unexpected character: '#' at line 1 column 1" on
# YAML input). Use opennebula/render.sh to convert this file to
# opennebula/service/aircraft.oneflow.json AND substitute the numeric
# VM template IDs (which OneFlow requires -- it will not look up
# templates by name).
#
# Why oneflow (vs. driving onevm three times by hand):
#   * Role dependency: `workers.parents = [controlplane]` makes
#     OpenNebula refuse to instantiate wk-1/wk-2 until cp-1 is
#     RUNNING. That is what removes the "wait, then read the join
#     token by hand" step from the manual runbook.
#   * Atomic teardown: `oneflow delete aircraft` removes both roles
#     in one shot.
#   * Cardinality: workers ship as a single role with cardinality=2,
#     so scaling to a 4-worker cluster is a one-line edit.
#
# IMPORTANT -- role name constraint:
#   OneFlow requires role names to match /^\w+$/, so hyphens are NOT
#   allowed. The control-plane role is therefore named `controlplane`
#   here (was `control-plane` in earlier drafts -- that was the
#   "KEY: 'name' must match regexp" validation error).
#
# Apply with:
#   opennebula/render.sh
#   oneflow-template create /tmp/onerender/aircraft.oneflow.json
#   # OpenNebula 7.x: instantiate takes no flags; pass JSON with
#   # top-level `custom_attrs_values` as a positional file argument.
#   oneflow-template instantiate <template-id> /tmp/onerender/instantiate.json
#
# Pre-requisites (already created via the runbook):
#   * onetemplate "aircraft-cp"        (opennebula/templates/cp.tpl)
#   * onetemplate "aircraft-wk"        (opennebula/templates/wk.tpl)
#   * onevnet     "aircraft-vnet"      (opennebula/vnet/aircraft-vnet.tpl)
#   * onesecgroup "aircraft-cluster"   (opennebula/security-groups/cluster.tpl)
#   * onesecgroup "aircraft-edge"      (opennebula/security-groups/edge.tpl)
#   * onesecgroup "aircraft-nodeport"  (opennebula/security-groups/nodeport.tpl)
# =====================================================================

name: "aircraft"
deployment: "straight"
description: "Aircraft SaaS Kubernetes cluster -- 1 control-plane + 2 workers on the aircraft-vnet (10.10.0.0/24)."

roles:
  # -------------------------------------------------------------------
  # Role: controlplane (was "control-plane" -- hyphen rejected by
  # OneFlow's /^\w+$/ regex).
  #
  # Single VM, cardinality fixed at 1. No min/max cooldown -- we never
  # auto-scale the control-plane.
  # -------------------------------------------------------------------
  - name: "controlplane"
    cardinality: 1
    # vm_template MUST be the NUMERIC ID. render.sh substitutes the
    # placeholder below with `onetemplate list | grep aircraft-cp`.
    vm_template: AIRCRAFT_CP_TEMPLATE_ID
    cooldown: 0

  # -------------------------------------------------------------------
  # Role: workers
  #
  # Cardinality 2, with the IaaS-level anti-affinity from wk.tpl's
  # SCHED_RANK. `parents: [controlplane]` is what gates the bootstrap
  # so workers do not poll for a join command that does not exist yet.
  # -------------------------------------------------------------------
  - name: "workers"
    cardinality: 2
    min_vms: 2
    max_vms: 4
    vm_template: AIRCRAFT_WK_TEMPLATE_ID
    parents:
      - "controlplane"
    cooldown: 30

# ---------------------------------------------------------------------
# Service-level USER_INPUTS exposed by `oneflow-template instantiate -i`.
# OPERATOR_CIDR is the kube-apiserver source whitelist. Fails closed
# on the default placeholder.
# ---------------------------------------------------------------------
custom_attrs:
  K8S_EDGE_HOST: "M|text|Edge DNS name DNAT-ed into cp-1| |aircraft.example.com"
  K8S_VERSION:   "M|list|Kubernetes minor version|1.30,1.31|1.30"
  OPERATOR_CIDR: "M|text|CIDR allowed to reach kube-apiserver via edge DNAT| |REPLACE_WITH_OPERATOR_CIDR"
