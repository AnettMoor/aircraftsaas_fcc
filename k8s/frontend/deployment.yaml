# vue-frontend Deployment (ns-frontend).
# Hardened deployment for the Vue frontend SPA, running the nginx-based static site as a non-root container with read-only filesystem settings

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue-frontend
  namespace: ns-frontend
  labels: { app: vue-frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: vue-frontend } }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: vue-frontend }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vue-frontend
          image: vue-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http }
          envFrom:
            - configMapRef: { name: vue-frontend-config }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 25m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Writable scratch dirs that nginx needs even on a
            # read-only root filesystem. The Dockerfile re-points
            # nginx's pid file into /tmp/nginx/nginx.pid.
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-tmp,   mountPath: /tmp/nginx }
            - { name: nginx-run,   mountPath: /var/run }
      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-tmp,   emptyDir: {} }
        - { name: nginx-run,   emptyDir: {} }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: vue-frontend }
