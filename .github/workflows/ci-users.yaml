# =====================================================================
# CI/CD — Users service
#
# Implements deploy.md §B.10 for the Users.WebHost slice:
#   * Path-filtered: only runs when something the Users service depends
#     on actually changes (its WebHost, its module sources, or the
#     shared libraries it links against).
#   * `dotnet test` for Users.Tests.
#   * Builds + pushes the image via the shared composite action.
#   * Rolls the Deployment in ns-users to the new tag.
#   * Runs an in-cluster smoke test against /health.
#
# Runs on the self-hosted runner (deploy.md §4.4) so kubectl reaches
# the apiserver via the projected ci-deployer SA token and `docker
# push` reaches registry.ns-registry.svc.cluster.local:5000.
#
# concurrency: per-service group + `cancel-in-progress: false` — a
# new commit during a deploy is queued, not pre-empted, so we never
# leave a half-rolled Deployment.
# =====================================================================
name: ci-users

on:
  push:
    branches: [main]
    paths:
      - "AircraftSaaS/Services/Users.WebHost/**"
      - "AircraftSaaS/Modules/Users/**"
      - "AircraftSaaS/Shared/**"
      - "AircraftSaaS/Tests/Users.Tests/**"
      - "Directory.Build.props"
      - "AircraftSaaS/AircraftSaaS.sln"
      - ".github/workflows/ci-users.yaml"
      - ".github/actions/build-and-push/**"
  workflow_dispatch:
  workflow_call:    # invoked by ci-shared.yaml when Shared/** changes

concurrency:
  group: ci-users-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE: users-service
  NAMESPACE: ns-users
  DEPLOYMENT: users-service
  CONTAINER: users-service
  DOTNET_VERSION: "10.0.x"

jobs:
  # -------------------------------------------------------------------
  # Stage 1 — unit tests. Runs on the self-hosted runner so we share
  # the NuGet cache across pipelines.
  # -------------------------------------------------------------------
  test:
    name: dotnet test (Users.Tests)
    runs-on: [self-hosted, Linux, X64, k8s, aircraft]
    env:
      DOTNET_INSTALL_DIR: /actions-runner/.dotnet
      DOTNET_ROOT: /actions-runner/.dotnet
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore (solution-scoped)
        working-directory: AircraftSaaS
        run: dotnet restore Tests/Users.Tests/Users.Tests.csproj

      - name: Test
        working-directory: AircraftSaaS
        run: |
          dotnet test Tests/Users.Tests/Users.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=users.trx" \
            --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-test-results
          path: AircraftSaaS/TestResults
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Stage 2 — build + push image. Build context is the AircraftSaaS
  # directory because Users.WebHost's Dockerfile copies from sibling
  # Modules/ and Shared/ paths.
  # -------------------------------------------------------------------
  build:
    name: docker build & push
    needs: test
    runs-on: [self-hosted, Linux, X64, k8s, aircraft]
    outputs:
      image: ${{ steps.bp.outputs.image }}
      tag:   ${{ steps.bp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build & push
        id: bp
        uses: ./.github/actions/build-and-push
        with:
          service:       users-service
          context:       AircraftSaaS
          dockerfile:    Services/Users.WebHost/Dockerfile
          registry-user: ${{ secrets.REGISTRY_USERNAME }}
          registry-pass: ${{ secrets.REGISTRY_PASSWORD }}

  # -------------------------------------------------------------------
  # Stage 3 — rolling update + smoke test.
  # -------------------------------------------------------------------
  deploy:
    name: rollout + smoke
    needs: build
    runs-on: [self-hosted, Linux, X64, k8s, aircraft]
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: kubectl set image
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" set image \
            deployment/"${DEPLOYMENT}" \
            "${CONTAINER}=${{ needs.build.outputs.image }}"

      - name: kubectl rollout status (<= 120s)
        run: |
          kubectl -n "${NAMESPACE}" rollout status \
            deployment/"${DEPLOYMENT}" --timeout=120s

      # In-cluster smoke test — bypasses the Ingress so an Ingress-side
      # regression doesn't mask a Pod-level health failure.
      - name: Smoke /health (in-cluster)
        run: |
          set -euo pipefail
          kubectl run smoke-users-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --rm -i --restart=Never \
            --namespace "${NAMESPACE}" \
            --image=curlimages/curl:8.10.1 \
            --command -- \
            curl -fsS --max-time 10 \
              "http://${DEPLOYMENT}.${NAMESPACE}.svc.cluster.local:8080/health"

      # Roll back to the previous revision if the smoke test (or any
      # earlier deploy step) fails, so the cluster is never left running
      # a broken image.
      - name: Rollback on failure
        if: failure()
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" rollout undo deployment/"${DEPLOYMENT}"
          kubectl -n "${NAMESPACE}" rollout status \
            deployment/"${DEPLOYMENT}" --timeout=120s
