# vue-frontend Service
# exposing the Vue frontend to the cluster and Ingress layer, mapping standard HTTP port 80 to the application's unprivileged container port 8080.

apiVersion: v1
kind: Service
metadata:
  name: vue-frontend
  namespace: ns-frontend
  labels: { app: vue-frontend }
spec:
  type: ClusterIP
  selector: { app: vue-frontend }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
