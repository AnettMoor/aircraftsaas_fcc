# users-service Deployment.
# Users service Deployment with rolling updates, health probes, hardened security settings, and configuration sourced from ConfigMaps and Secrets.


apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: ns-users
  labels: { app: users-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: users-service } }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: users-service }
    spec:
      automountServiceAccountToken: true
      containers:
        - name: users-service
          image: users-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: users-config }
            - secretRef:    { name: users-secret }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: users-service }
