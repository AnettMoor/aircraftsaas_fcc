services:
  postgres-aircraft-modular:
    container_name: "postgres-aircraft-modular"
    pull_policy: always
    image: postgres:16
    command: postgres -c 'max_connections=1000'
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aircraft-users
    volumes:
      - postgres-aircraft-modular-data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "7892:5432"
    networks:
      - aircraft-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "aircraft-webapp-modular"
    restart: unless-stopped
    ports:
      - "88:8080"
    volumes:
      - webapp-uploads:/app/wwwroot/uploads
    networks:
      - aircraft-net
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - TenantSlug=${TENANT_SLUG:-c1}
      - ConnectionStrings__UsersConnection=Host=postgres-aircraft-modular;Port=5432;Database=aircraft-users;Username=postgres;Password=postgres;Timeout=30;Command Timeout=60
      - ConnectionStrings__FleetConnection=Host=postgres-aircraft-modular;Port=5432;Database=aircraft-fleet;Username=postgres;Password=postgres;Timeout=30;Command Timeout=60
      - ConnectionStrings__BookingConnection=Host=postgres-aircraft-modular;Port=5432;Database=aircraft-booking;Username=postgres;Password=postgres;Timeout=30;Command Timeout=60
      - DataInitialization__DropDatabase=false
      - DataInitialization__MigrateDatabase=true
      - DataInitialization__SeedIdentity=true
      - DataInitialization__SeedData=true
      - DataInitialization__SeedAppUserCompanies=true
    depends_on:
      postgres-aircraft-modular:
        condition: service_healthy

volumes:
  postgres-aircraft-modular-data:
  webapp-uploads:

networks:
  aircraft-net:
    name: aircraft-net-modular