# =====================================================================
# Per-service runtime ServiceAccounts — Phase C §C.14.
#
# Each application Pod runs under a dedicated, zero-privilege
# ServiceAccount:
#
#   ns-users     → users-runtime
#   ns-fleet     → fleet-runtime
#   ns-booking   → booking-runtime
#   ns-frontend  → vue-frontend-runtime
#
# Rationale:
#   * The default ServiceAccount in every namespace has its token
#     auto-mounted into every Pod that doesn't say otherwise. A
#     compromised app pod with default SA + automount is one
#     `curl https://kubernetes.default.svc/...` away from
#     reconnaissance of cluster RBAC.
#   * Phase C closes that by (a) creating a dedicated SA with NO
#     RoleBindings at all, and (b) flipping
#     `automountServiceAccountToken: false` on every app Deployment
#     (patched in k8s/rbac/automount-disable.yaml).
#
# These SAs intentionally have NO Roles bound to them — they are
# *capability tokens*, used by the Pod only to identify itself to
# admission-time policies (e.g. PSA, NetworkPolicy in CNIs that
# support identity-aware policy). No Kubernetes API access is needed
# for any of the app code paths.
#
# imagePullSecret: the local-registry pullsecret (k8s/registry/
# auth-secret.yaml) is referenced here so kubelet can pull the
# private images without needing it on the default SA.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: users-runtime
  namespace: ns-users
  labels: { app: users-service }
automountServiceAccountToken: false
imagePullSecrets:
  - name: local-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-runtime
  namespace: ns-fleet
  labels: { app: fleet-service }
automountServiceAccountToken: false
imagePullSecrets:
  - name: local-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-runtime
  namespace: ns-booking
  labels: { app: booking-service }
automountServiceAccountToken: false
imagePullSecrets:
  - name: local-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vue-frontend-runtime
  namespace: ns-frontend
  labels: { app: vue-frontend }
automountServiceAccountToken: false
imagePullSecrets:
  - name: local-registry
