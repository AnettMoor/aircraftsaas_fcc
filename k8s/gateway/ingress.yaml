---
# ---------------------------------------------------------------------
# Vue SPA (ns-frontend).
#
# The placeholder host `app.aircraft.localtest.me` is rewritten to
# `app.aircraft.example.com` by overlays/opennebula/kustomization.yaml
# for the production cluster.
#
# The Vue bundle calls the backend services on their own subdomains
# (users.* / fleet.* / booking.*) — there is intentionally no /api/*
# path rule here, because the in-pod nginx no longer proxies API
# traffic (frontend_vue/nginx.conf was reworked in Phase A).
#
# The CSP for the SPA host is slightly relaxed compared to the API
# hosts (allows `connect-src` to the sibling api subdomains) so the
# bundle can XHR to users./fleet./booking.* from the browser.
# ---------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: ns-frontend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; connect-src 'self' https://users.aircraft.localtest.me https://fleet.aircraft.localtest.me https://booking.aircraft.localtest.me; frame-ancestors 'none'";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.aircraft.localtest.me]
      secretName: frontend-tls
  rules:
  - host: app.aircraft.localtest.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vue-frontend
            port: { number: 80 }
