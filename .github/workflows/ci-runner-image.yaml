# =====================================================================
# CI/CD — Custom GitHub Actions runner image
#
# Builds and pushes the custom runner image (k8s/ci/runner.Dockerfile)
# to the in-cluster registry whenever the Dockerfile or this workflow
# file changes.
#
# After the image is pushed, the runner Deployment must be restarted so
# the new image is pulled:
#   kubectl -n ns-ci rollout restart deployment/github-runner
#
# The image is tagged with the short SHA (immutable) and `latest`
# (mutable, used by the Deployment's imagePullPolicy: Always).
# =====================================================================
name: ci-runner-image

on:
  push:
    branches: [main]
    paths:
      - "k8s/ci/runner.Dockerfile"
      - ".github/workflows/ci-runner-image.yaml"
  workflow_dispatch:

concurrency:
  group: ci-runner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build & push runner image
    runs-on: [self-hosted, Linux, X64, k8s, aircraft]
    steps:
      - uses: actions/checkout@v4

      - name: Build & push
        uses: ./.github/actions/build-and-push
        with:
          service:       github-runner
          context:       k8s/ci
          dockerfile:    runner.Dockerfile
          registry-user: ${{ secrets.REGISTRY_USERNAME }}
          registry-pass: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Restart runner Deployment to pick up new image
        run: |
          set -euo pipefail
          kubectl -n ns-ci rollout restart deployment/github-runner
          kubectl -n ns-ci rollout status deployment/github-runner --timeout=120s
