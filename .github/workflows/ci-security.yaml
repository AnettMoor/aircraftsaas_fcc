# =====================================================================
# CI — Security validation (Phase C §C.12 + §C.13 + §C.16).
#
# Runs on every push to main and on every PR that touches the security
# surface: k8s manifests, the build composite action, the network-policy
# test, or the pre-commit hook.
#
# Two jobs:
#
#   plaintext-secret-scan
#     Re-runs the same logic as the pre-commit hook
#     (scripts/git-hooks/pre-commit-no-plaintext-secrets.sh) against
#     EVERY tracked file — not just staged ones. Catches the case
#     where a developer bypassed the local hook with --no-verify.
#
#   netpol-chaos
#     Runs tests/k8s/network-policy.sh against the live cluster (the
#     same self-hosted runner that the deploy workflows use, so the
#     ci-deployer SA token gives it read access to ns-users/fleet/
#     booking/frontend pods and the right to spawn the probe pods).
#     Required to pass before main is considered green.
# =====================================================================
name: ci-security

on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - ".github/workflows/ci-security.yaml"
      - ".github/actions/build-and-push/**"
      - "tests/k8s/**"
      - "scripts/git-hooks/**"
  pull_request:
    paths:
      - "k8s/**"
      - ".github/workflows/ci-security.yaml"
      - ".github/actions/build-and-push/**"
      - "tests/k8s/**"
      - "scripts/git-hooks/**"
  workflow_dispatch:

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Repository-wide plaintext-secret scan.
  # -------------------------------------------------------------------
  plaintext-secret-scan:
    name: scan for plaintext Secrets
    # GitHub-hosted is fine — this is pure file scanning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan k8s/** for kind: Secret with stringData/data
        shell: bash
        run: |
          set -euo pipefail
          violations=0
          while IFS= read -r f; do
            case "$f" in
              k8s/sealed-secrets/*) continue ;;
            esac
            if grep -qE '^[[:space:]]*#[[:space:]]*pre-commit:allow-plaintext-secret' "$f"; then
              continue
            fi
            if awk '
                /^---[[:space:]]*$/ { kind=""; next }
                /^kind:[[:space:]]*Secret[[:space:]]*$/ { kind="Secret" }
                /^kind:[[:space:]]*SealedSecret[[:space:]]*$/ { kind="SealedSecret" }
                /^(stringData|data):[[:space:]]*$/ {
                  if (kind == "Secret") found=1
                }
                END { exit (found ? 0 : 1) }
              ' "$f"; then
              echo "::error file=$f::plaintext kind: Secret committed"
              violations=$((violations + 1))
            fi
          done < <(find k8s -type f \( -name '*.yml' -o -name '*.yaml' \))
          if [ "$violations" -gt 0 ]; then
            echo "Refusing main: $violations plaintext Secret manifest(s)."
            exit 1
          fi

  # -------------------------------------------------------------------
  # Live NetworkPolicy chaos test. Self-hosted because it needs to
  # `kubectl run` busybox pods inside the target namespaces.
  # -------------------------------------------------------------------
  netpol-chaos:
    name: NetworkPolicy chaos test
    needs: plaintext-secret-scan
    runs-on: [self-hosted, linux, k8s, aircraft]
    steps:
      - uses: actions/checkout@v4

      - name: kubectl context sanity
        run: kubectl cluster-info >/dev/null

      - name: Run tests/k8s/network-policy.sh
        run: bash tests/k8s/network-policy.sh
