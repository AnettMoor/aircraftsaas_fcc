# =====================================================================
# OpenNebula overlay
#
# Production preset targeted at the 1 control-plane + 2 worker cluster
# running on the OpenNebula IaaS substrate (see plans/deploy.md §2).
#
# Differences from the base:
#   1. Replicas bumped 2 -> 3 so a single node loss still leaves quorum.
#   2. Anti-affinity spreads replicas across the two worker nodes.
#   3. Hostnames swapped from *.aircraft.localtest.me to
#      *.aircraft.example.com (real edge DNS provided by OpenNebula NAT).
#   4. Images pulled from the in-cluster registry by FQDN
#      (registry.ns-registry.svc.cluster.local:5000/<svc>:<sha>).
#      The actual `<sha>` is patched in by the CI pipeline at deploy time
#      via `kubectl set image`; this overlay only fixes the *prefix*.
#
# The infra services (Postgres / RabbitMQ) intentionally stay 1-replica
# StatefulSets here. Multi-node infra is out of scope (deploy.md §10).
# =====================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../cert-manager

components:
  # Phase C §C.14 — runtime SAs + automountSAToken=false +
  # readOnlyRootFilesystem applied here so the patch can reach the
  # Deployments pulled in via ../../base.
  - ../../rbac

# --- Image rewrites ----------------------------------------------------
# The base uses placeholder `<svc>:dev` references. OpenNebula pulls
# from the in-cluster registry instead. CI overrides the tag at
# rollout time; here we only set the prefix + a sane default tag.
images:
  - name: users-service
    newName: registry.ns-registry.svc.cluster.local:5000/users-service
    newTag: latest
  - name: fleet-service
    newName: registry.ns-registry.svc.cluster.local:5000/fleet-service
    newTag: latest
  - name: booking-service
    newName: registry.ns-registry.svc.cluster.local:5000/booking-service
    newTag: latest
  - name: vue-frontend
    newName: registry.ns-registry.svc.cluster.local:5000/vue-frontend
    newTag: latest

# --- Replica + scheduling patches -------------------------------------
patches:
  # Bump backend Deployments to 3 replicas and add topology spread across
  # the two worker nodes. The HPA `minReplicas` is also bumped so the
  # autoscaler doesn't immediately scale us back down to 2.
  - target: { kind: Deployment, name: users-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels: { app: users-service }
  - target: { kind: Deployment, name: fleet-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels: { app: fleet-service }
  - target: { kind: Deployment, name: booking-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels: { app: booking-service }
  - target: { kind: Deployment, name: vue-frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Real edge hostnames. The base uses placeholder *.aircraft.localtest.me
  # which is rewritten here to the real edge DNS provided by OpenNebula NAT.
  - target: { kind: Ingress, name: users-ingress }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: users.aircraft.example.com
  - target: { kind: Ingress, name: fleet-ingress }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fleet.aircraft.example.com
  - target: { kind: Ingress, name: booking-ingress }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: booking.aircraft.example.com
  - target: { kind: Ingress, name: frontend-ingress }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.aircraft.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.aircraft.example.com

  # --- Phase C §C.15: every Ingress carries a placeholder
  # `cert-manager.io/cluster-issuer` annotation in the base; the
  # overlay points it at `letsencrypt-staging`. Promote to
  # `letsencrypt-prod` by editing this overlay once staging succeeds.
  - target: { kind: Ingress, name: users-ingress }
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
      - op: replace
        path: /spec/tls/0/hosts/0
        value: users.aircraft.example.com
  - target: { kind: Ingress, name: fleet-ingress }
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
      - op: replace
        path: /spec/tls/0/hosts/0
        value: fleet.aircraft.example.com
  - target: { kind: Ingress, name: booking-ingress }
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
      - op: replace
        path: /spec/tls/0/hosts/0
        value: booking.aircraft.example.com
  - target: { kind: Ingress, name: frontend-ingress }
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging

  # ---------------------------------------------------------------------
  # plans/opennebula.md §4.1 functional patches applied on the
  # OpenNebula overlay (the only production deploy target).
  # ---------------------------------------------------------------------

  # 1. Force `imagePullPolicy: Always` on every app container. The
  #    in-cluster registry tag is `latest` by default (and overridden to
  #    a git-sha by CI at deploy time). With `IfNotPresent` the kubelet
  #    would happily keep running a stale local copy of `latest` after
  #    a re-push, which is wrong for a production rollout.
  - target: { kind: Deployment, name: users-service }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Deployment, name: fleet-service }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Deployment, name: booking-service }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Deployment, name: vue-frontend }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # 2. Same for the EF Core migration Jobs — they run once at deploy
  #    time but MUST execute against the just-pushed image, not a
  #    cached one (otherwise schema migrations and runtime drift).
  #    The Kustomize `images:` block above already rewrites the
  #    image *reference* (users-service -> registry FQDN); this patch
  #    only handles the pull policy.
  - target: { kind: Job, name: users-migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Job, name: fleet-migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target: { kind: Job, name: booking-migrate }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # 3. Rewrite the inline CSP `connect-src` whitelist on the frontend
  #    Ingress. The host-replacement patches above swap the Ingress
  #    `host:` field but DO NOT touch the annotation body, so the SPA
  #    bundle running on https://app.aircraft.example.com would still
  #    be CSP-blocked from XHR'ing the *.aircraft.example.com API
  #    subdomains. We replace the whole `configuration-snippet`
  #    annotation in one shot so the next CSP edit only touches one
  #    place.
  - target: { kind: Ingress, name: frontend-ingress }
    patch: |-
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1configuration-snippet
        value: |
          more_set_headers "X-Frame-Options: DENY";
          more_set_headers "X-Content-Type-Options: nosniff";
          more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
          more_set_headers "Content-Security-Policy: default-src 'self'; connect-src 'self' https://users.aircraft.example.com https://fleet.aircraft.example.com https://booking.aircraft.example.com; frame-ancestors 'none'";

  # 4. Delete the plaintext `registry-auth` Secret shipped under
  #    k8s/registry/auth-secret.yaml (placeholder credentials
  #    `ciuser:ciuser`). It is replaced by
  #    k8s/sealed-secrets/registry-auth-sealedsecret.yaml, which is
  #    already part of the sealed-secrets component. Same `$patch:
  #    delete` story applies to the per-namespace `local-registry`
  #    imagePullSecrets (their real values come from the
  #    SealedSecret on apply).
  - target: { kind: Secret, name: registry-auth, namespace: ns-registry }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: registry-auth
        namespace: ns-registry
  - target: { kind: Secret, name: local-registry, namespace: ns-users }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: local-registry
        namespace: ns-users
  - target: { kind: Secret, name: local-registry, namespace: ns-fleet }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: local-registry
        namespace: ns-fleet
  - target: { kind: Secret, name: local-registry, namespace: ns-booking }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: local-registry
        namespace: ns-booking
  - target: { kind: Secret, name: local-registry, namespace: ns-frontend }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: local-registry
        namespace: ns-frontend

