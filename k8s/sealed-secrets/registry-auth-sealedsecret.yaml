spec:
  encryptedData:
    .dockerconfigjson: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: local-registry
      namespace: ns-frontend
    type: kubernetes.io/dockerconfigjson
