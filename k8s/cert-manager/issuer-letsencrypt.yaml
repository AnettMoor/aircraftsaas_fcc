# =====================================================================
# Let's Encrypt issuers (OpenNebula edge).
#
# Two issuers shipped:
#
#   letsencrypt-staging — staging endpoint. Generous rate limits and
#                         untrusted by browsers, but proves the
#                         HTTP-01 challenge round-trip end-to-end.
#                         The OpenNebula overlay default.
#
#   letsencrypt-prod    — production endpoint. Switch the overlay's
#                         cert-manager.io/cluster-issuer annotation to
#                         this one once the staging issuance succeeds
#                         to avoid burning prod rate limits while
#                         debugging.
#
# HTTP-01 challenge: cert-manager creates a transient Ingress on
# `/.well-known/acme-challenge/<token>` per request. ingress-nginx
# must therefore be reachable from the public Internet on port 80
# (this is guaranteed by the OpenNebula edge DNAT defined in
# plans/deploy.md §2.2).
#
# Replace `OPERATOR_EMAIL_REPLACE_ME@aircraft.example.com` below with
# a mailbox that the operations team monitors — Let's Encrypt mails
# expiry warnings there.
# =====================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: OPERATOR_EMAIL_REPLACE_ME@aircraft.example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: OPERATOR_EMAIL_REPLACE_ME@aircraft.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
