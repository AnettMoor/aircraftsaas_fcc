# ns-infra ingress/egress policies.
# Allows only the explicit ns-infra service-to-service paths required for Postgres, RabbitMQ, and DNS.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-postgres-ingress, namespace: ns-infra }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
  # users-service pods in ns-users (AND, not OR — same array element)
  - from:
    - namespaceSelector: { matchLabels: { name: ns-users } }
      podSelector:       { matchLabels: { app: users-service } }
    ports: [{ protocol: TCP, port: 5432 }]
  # fleet-service pods in ns-fleet
  - from:
    - namespaceSelector: { matchLabels: { name: ns-fleet } }
      podSelector:       { matchLabels: { app: fleet-service } }
    ports: [{ protocol: TCP, port: 5432 }]
  # booking-service pods in ns-booking
  - from:
    - namespaceSelector: { matchLabels: { name: ns-booking } }
      podSelector:       { matchLabels: { app: booking-service } }
    ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-rabbitmq-ingress, namespace: ns-infra }
spec:
  podSelector: { matchLabels: { app: rabbitmq } }
  policyTypes: [Ingress]
  ingress:
  # AMQP only. Management UI (:15672) intentionally NOT exposed; reach
  # it via `kubectl port-forward svc/rabbitmq -n ns-infra 15672:15672`.
  - from:
    - namespaceSelector: { matchLabels: { name: ns-users } }
      podSelector:       { matchLabels: { app: users-service } }
    ports: [{ protocol: TCP, port: 5672 }]
  - from:
    - namespaceSelector: { matchLabels: { name: ns-fleet } }
      podSelector:       { matchLabels: { app: fleet-service } }
    ports: [{ protocol: TCP, port: 5672 }]
  - from:
    - namespaceSelector: { matchLabels: { name: ns-booking } }
      podSelector:       { matchLabels: { app: booking-service } }
    ports: [{ protocol: TCP, port: 5672 }]
---
# Both Postgres and RabbitMQ still need DNS egress (peer/cluster name
# resolution). DNS is the only outbound traffic ns-infra is permitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-infra-dns-egress, namespace: ns-infra }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  # DNS (CoreDNS) — must use the auto-injected
  # kubernetes.io/metadata.name label, because kube-system does NOT have
  # a `name=kube-system` label by default on stock Kubernetes / kubeadm
  # clusters.
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
      podSelector:
        matchLabels: { k8s-app: kube-dns }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
