# =====================================================================
# Pod-level hardening patches — Phase C §C.14.
#
# Strategic-merge patches that the Phase C overlay applies on top of the
# base Deployments. They flip three properties for every app workload:
#
#   1. spec.template.spec.serviceAccountName           = <svc>-runtime
#   2. spec.template.spec.automountServiceAccountToken = false
#   3. spec.template.spec.containers[*].securityContext.readOnlyRootFilesystem = true
#
# .NET 10 containers need a writable scratch directory for the diagnostic
# pipe socket and OpenTelemetry temp files. We add `emptyDir` mounts at
# /tmp and /var/tmp so readOnlyRootFilesystem does not break startup.
#
# These patches are kept out of the base Deployments because Phase A
# explicitly documented that automount stays on in the base ("Phase C
# will flip this to false" — see comment in k8s/users/deployment.yaml).
# Putting the change here keeps that commit-trail honest.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: ns-users
spec:
  template:
    spec:
      serviceAccountName: users-runtime
      automountServiceAccountToken: false
      containers:
        - name: users-service
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp,      mountPath: /tmp }
            - { name: var-tmp,  mountPath: /var/tmp }
            - { name: dotnet,   mountPath: /home/app/.dotnet }
      volumes:
        - { name: tmp,     emptyDir: {} }
        - { name: var-tmp, emptyDir: {} }
        - { name: dotnet,  emptyDir: {} }
---
