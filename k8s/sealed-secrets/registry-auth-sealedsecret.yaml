# SealedSecrets for registry authentication and per-namespace imagePullSecrets,
# replacing plaintext registry credentials with encrypted equivalents.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-auth
  namespace: ns-registry
spec:
  encryptedData:
    htpasswd: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: registry-auth
      namespace: ns-registry
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: local-registry
  namespace: ns-users
spec:
  encryptedData:
    .dockerconfigjson: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: local-registry
      namespace: ns-users
    type: kubernetes.io/dockerconfigjson
---
