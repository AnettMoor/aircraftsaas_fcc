# vue-frontend ConfigMap.
#
# The Vue SPA bakes VITE_* env vars at *build* time (Vite static-replaces
# them into the bundle). This ConfigMap therefore does NOT inject the
# API URL — the build-time arg is set in CI via Docker BuildKit's
# --build-arg. The ConfigMap exists for nginx runtime knobs for tweaking without rebuilding the image 

apiVersion: v1
kind: ConfigMap
metadata:
  name: vue-frontend-config
  namespace: ns-frontend
data:
  # Currently unused at runtime — the Dockerfile's nginx.conf is
  # baked into the image. Kept here as the canonical extension point
  # for future env-driven configuration without breaking the manifest
  # surface of the Deployment.
  NGINX_WORKER_PROCESSES: "auto"
