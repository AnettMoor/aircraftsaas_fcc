apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-migrate
  namespace: ns-fleet
  annotations:
    description: "Runs EF Core Migrate() exactly once before fleet-service rollout."
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      # NOTE — `app: fleet-service` is REQUIRED on the Job Pod template
      # so the migration Pod matches the per-pod ingress rule on
      # postgres in k8s/network-policies/allow-infra.yaml. Without this
      # label the migration would be silently denied at the Postgres
      # NetworkPolicy and the Job would hang at backoffLimit.
      labels: { app: fleet-service }
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: fleet-service:dev
        imagePullPolicy: IfNotPresent
        env:
        # Override the runtime ConfigMap so this one-shot Job actually migrates
        # and seeds. Evaluated by Fleet.WebHost/Program.cs SetupAppData() and
        # the ExitAfterMigrate gate added immediately after it.
        - { name: DataInitialization__MigrateDatabase,   value: "true" }
        - { name: DataInitialization__SeedData,          value: "true" }
        - { name: DataInitialization__ExitAfterMigrate,  value: "true" }
        envFrom:
        # The Fleet seeder calls Users to resolve a company-slug -> Guid map
        # (see Fleet.WebHost/Program.cs FetchCompanySlugMapping). Without the
        # ConfigMap, UsersService__BaseUrl falls back to localhost and seeding
        # silently produces an empty mapping.
        - configMapRef: { name: fleet-config }
        - secretRef:    { name: fleet-secret }
