# =====================================================================
# Vue SPA nginx config — pure static-asset server.
#
# In docker-compose mode the previous version of this file proxied
# `/api/*` to the legacy `aircraft-webapp-clean` container via Docker's
# embedded DNS resolver. Under Kubernetes that is the wrong place to
# do the routing:
#
#   * The Ingress already terminates TLS, applies per-host routing
#     (users.* / fleet.* / booking.*), and enforces NetworkPolicies at
#     namespace boundaries. Re-proxying inside the SPA pod would either
#     bypass those policies or duplicate the routing table.
#   * The browser, not the pod, holds the JWT cookie and the user's
#     CORS origin; making the pod the intermediate hop hides those.
#
# So this nginx instance now serves the SPA static bundle and nothing
# else. All `/api/*` calls leave the pod and hit the Ingress directly
# (the browser uses VITE_API_BASE_URL baked at Vite build time).
#
# It also listens on :8080 (not :80) so it can run as a non-root user;
# the Service in k8s/frontend/service.yaml maps Service :80 -> :8080.
# =====================================================================
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- gzip ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # --- security headers --------------------------------------------
    # Defence-in-depth; the Ingress sets these too (k8s/gateway/ingress.yaml)
    # but having them at the origin protects pod-internal probes and the
    # case where someone bypasses the Ingress for debugging.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- liveness/readiness endpoint ---------------------------------
    # Kubernetes probes hit this. Cheap, no I/O, always 200.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- long-lived static assets ------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------
    # Vue Router uses HTML5 history mode; any unknown path must serve
    # index.html so the client-side router can pick it up.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
