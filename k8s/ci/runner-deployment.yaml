apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: ns-ci
  labels:
    app: github-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: ci-deployer
      automountServiceAccountToken: true

      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch

      initContainers:
        - name: seed-runner-home
          image: myoung34/github-runner:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - |
              set -e
              cp -a /actions-runner/. /runner-home/
              mkdir -p /runner-home/_diag /runner-home/_work
              chown -R 1001:121 /runner-home /_work /tmp
              chmod -R ug+rwX /runner-home /_work /tmp
          volumeMounts:
            - name: runner-home
              mountPath: /runner-home
            - name: work
              mountPath: /_work
            - name: tmp
              mountPath: /tmp

      containers:
        - name: runner
          image: myoung34/github-runner:latest
          imagePullPolicy: IfNotPresent
          workingDir: /actions-runner
          env:
            - name: REPO_URL
              valueFrom:
                secretKeyRef:
                  name: github-runner
                  key: RUNNER_REPO_URL
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner
                  key: RUNNER_TOKEN
            - name: LABELS
              valueFrom:
                secretKeyRef:
                  name: github-runner
                  key: RUNNER_LABELS
            - name: RUNNER_NAME_PREFIX
              valueFrom:
                secretKeyRef:
                  name: github-runner
                  key: RUNNER_NAME_PREFIX
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: EPHEMERAL
              value: "true"
            - name: ADDITIONAL_PACKAGES
              value: kubectl curl jq
            - name: RUN_AS_ROOT
              value: "false"
            - name: RUNNER_WORKDIR
              value: /_work
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            - name: runner-home
              mountPath: /actions-runner
            - name: work
              mountPath: /_work
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1001
            runAsGroup: 121
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        - name: dind
          image: docker:24-dind
          imagePullPolicy: IfNotPresent
          args:
            - --host=tcp://0.0.0.0:2375
            - --insecure-registry=registry.ns-registry.svc.cluster.local:5000
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            - name: docker-graph
              mountPath: /var/lib/docker
            - name: work
              mountPath: /_work

      volumes:
        - name: runner-home
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: docker-graph
          emptyDir: {}