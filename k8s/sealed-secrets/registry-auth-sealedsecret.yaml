# =====================================================================
# registry-auth + per-namespace local-registry — SealedSecret form
#
# Replaces k8s/registry/auth-secret.yaml. Both the htpasswd (consumed
# by the registry server) and the dockerconfigjson imagePullSecrets
# (consumed by each app namespace's default SA) move into sealed form.
#
# Until the kustomize delete-patch in k8s/sealed-secrets/kustomization.yaml
# is wired into the base, the plaintext auth-secret.yaml is still the
# operational source of truth. See README.md for the cut-over sequence.
# =====================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-auth
  namespace: ns-registry
spec:
  encryptedData:
    htpasswd: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: registry-auth
      namespace: ns-registry
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: local-registry
  namespace: ns-users
spec:
  encryptedData:
    .dockerconfigjson: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: local-registry
      namespace: ns-users
    type: kubernetes.io/dockerconfigjson
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: local-registry
  namespace: ns-fleet
spec:
  encryptedData:
    .dockerconfigjson: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: local-registry
      namespace: ns-fleet
    type: kubernetes.io/dockerconfigjson
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: local-registry
  namespace: ns-booking
spec:
  encryptedData:
    .dockerconfigjson: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: local-registry
      namespace: ns-booking
    type: kubernetes.io/dockerconfigjson
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: local-registry
