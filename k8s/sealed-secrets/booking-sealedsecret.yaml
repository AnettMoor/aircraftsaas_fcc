# booking-secret — SealedSecret form
# Replaces k8s/booking/secret.yaml.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: booking-secret
  namespace: ns-booking
spec:
  encryptedData:
    ConnectionStrings__BookingConnection: PLACEHOLDER_RESEAL_BEFORE_APPLY
    JWT__Key:                             PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__UserName:                   PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__Password:                   PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: booking-secret
      namespace: ns-booking
    type: Opaque
