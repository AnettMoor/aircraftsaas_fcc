# =====================================================================
# postgres-secret — SealedSecret form (Phase C §C.13).
#
# Replaces the inline `postgres-secret` block at the top of
# k8s/infra/postgres.yaml. The Phase C kustomization (see
# k8s/sealed-secrets/kustomization.yaml) deletes the inline secret
# via a $patch: delete strategic merge patch and installs this
# SealedSecret in its place. Until the kustomize patch is wired into
# the base, the plaintext secret at the top of postgres.yaml remains
# the operational source of truth.
# =====================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: ns-infra
spec:
  encryptedData:
    POSTGRES_USER:     PLACEHOLDER_RESEAL_BEFORE_APPLY
    POSTGRES_PASSWORD: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: postgres-secret
      namespace: ns-infra
    type: Opaque
