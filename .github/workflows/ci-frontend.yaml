# CI/CD — Vue frontend


name: ci-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend_vue/**"
      - ".github/workflows/ci-frontend.yaml"
      - ".github/actions/build-and-push/**"
  workflow_dispatch:

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE: vue-frontend
  NAMESPACE: ns-frontend
  DEPLOYMENT: vue-frontend
  CONTAINER: vue-frontend
  NODE_VERSION: "20"

jobs:
  # (lint) + type-check + build (build catches type errors via `vue-tsc --noEmit && vite build` in package.json).
  test:
    name: vue lint + typecheck + build
    runs-on: [self-hosted, Linux, X64, k8s, aircraft]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend_vue/package-lock.json

      - name: Install
        working-directory: frontend_vue
        run: npm ci

      - name: Type check
        working-directory: frontend_vue
        run: npm run type-check

      # removed eslint 

      - name: Build
        working-directory: frontend_vue
        run: npm run build

  # Stage 2 — Docker build + push.
  build:
    name: docker build & push
    needs: test
    runs-on: [self-hosted, Linux, X64, k8s, aircraft]
    outputs:
      image: ${{ steps.bp.outputs.image }}
      tag:   ${{ steps.bp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Build & push
        id: bp
        uses: ./.github/actions/build-and-push
        with:
          service:       vue-frontend
          context:       frontend_vue
          dockerfile:    Dockerfile
          registry-user: ${{ secrets.REGISTRY_USERNAME }}
          registry-pass: ${{ secrets.REGISTRY_PASSWORD }}
          build-args: |
            VITE_USERS_URL=https://users.aircraft.localtest.me:31857
            VITE_FLEET_URL=https://fleet.aircraft.localtest.me:31857
            VITE_BOOKING_URL=https://booking.aircraft.localtest.me:31857

  # Stage 3 — rolling update + healthcheck. The frontend serves static assets
  # on container :8080 behind a ClusterIP Service on :80 
  # (k8s/frontend/service.yaml), so the smoke probe targets / on :80.
  deploy:
    name: rollout + smoke
    needs: build
    runs-on: [self-hosted, Linux, X64, k8s, aircraft]
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: kubectl set image
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" set image \
            deployment/"${DEPLOYMENT}" \
            "${CONTAINER}=${{ needs.build.outputs.image }}"

      - name: kubectl rollout status (<= 120s)
        run: |
          kubectl -n "${NAMESPACE}" rollout status \
            deployment/"${DEPLOYMENT}" --timeout=120s

      - name: Smoke / (in-cluster)
        run: |
          set -euo pipefail
          kubectl run smoke-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --rm -i --restart=Never \
            --namespace "${NAMESPACE}" \
            --image=curlimages/curl:8.10.1 \
            --command -- \
            curl -fsS --max-time 10 \
              "http://${DEPLOYMENT}.${NAMESPACE}.svc.cluster.local/"

      # Roll back to the previous revision if something fails, cluster never left running on a broken image.
      - name: Rollback on failure
        if: failure()
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" rollout undo deployment/"${DEPLOYMENT}"
          kubectl -n "${NAMESPACE}" rollout status \
            deployment/"${DEPLOYMENT}" --timeout=120s
