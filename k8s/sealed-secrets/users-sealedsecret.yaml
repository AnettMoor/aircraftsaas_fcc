# =====================================================================
# users-secret — SealedSecret form (Phase C §C.13).
#
# This file REPLACES k8s/users/secret.yaml in the deployed posture.
# The plaintext companion (key=value table below) lives ONLY in the
# operator's vault — never in Git.
#
# encryptedData blocks below are PLACEHOLDERS. Real values are produced
# by running scripts/seal-secrets.sh against a live controller; until
# then `kubectl apply` will error out (SealedSecret payload validation
# fails). This is intentional — committing real ciphertext requires
# an actual cluster cert and the rotation procedure documented in
# k8s/sealed-secrets/README.md.
#
# Plaintext schema (kept here as a documentation comment, NOT data):
#   ConnectionStrings__UsersConnection
#   JWT__Key
#   RabbitMQ__UserName
#   RabbitMQ__Password
# =====================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: users-secret
  namespace: ns-users
  # Namespace-scoped scope (default): the controller will only decrypt
  # this SealedSecret if it is applied to ns-users. Renaming or moving
  # the resource invalidates the seal — by design.
spec:
  encryptedData:
    ConnectionStrings__UsersConnection: PLACEHOLDER_RESEAL_BEFORE_APPLY
    JWT__Key:                           PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__UserName:                 PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__Password:                 PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: users-secret
      namespace: ns-users
    type: Opaque
