# Internal ClusterIP service exposing the in-cluster Docker registry, 
#providing a stable endpoint for image pushes by the CI pipeline and image pulls by Kubernetes workloads.

apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: ns-registry
  labels: { app: registry }
spec:
  type: ClusterIP
  selector: { app: registry }
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
