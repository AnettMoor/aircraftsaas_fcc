# SealedSecret for PostgreSQL credentials, replacing the inline postgres-secret with an encrypted equivalent.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: ns-infra
spec:
  encryptedData:
    POSTGRES_USER:     PLACEHOLDER_RESEAL_BEFORE_APPLY
    POSTGRES_PASSWORD: PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: postgres-secret
      namespace: ns-infra
    type: Opaque
