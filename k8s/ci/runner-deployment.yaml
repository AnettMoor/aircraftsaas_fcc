# =====================================================================
# Self-hosted GitHub Actions runner.
#
#   * The cluster lives behind OpenNebula's edge — GitHub-hosted runners
#     cannot reach `kubectl` or the in-cluster registry. A self-hosted
#     runner Deployment in ns-ci is the bridge.
#   * Runs under the `ci-deployer` ServiceAccount (k8s/ci/rbac.yaml),
#     so kubectl inside the runner Pod authenticates via the projected
#     SA token and is namespaced-scoped to ns-{users,fleet,booking,frontend}.
#   * Uses myoung34/github-runner — a community image that wraps
#     `actions/runner` with auto-registration via env vars.
#   * Persists the runner identity on an emptyDir (Pod lifetime). For
#     production a PVC could be substituted so re-creates skip the
#     registration round-trip; for Phase B's "automate what now works
#     manually" goal, ephemeral identity is intentional — every pod
#     restart re-registers with a fresh registration token, which means
#     the GitHub side never holds stale runner records.
#   * Docker-in-Docker is provided by a sidecar `dind` container so the
#     workflow can run `docker buildx build --push` without needing the
#     node's container runtime. The runner connects to it over the
#     shared Pod network at tcp://localhost:2375.
#
# This deployment is intentionally a single replica: GitHub Actions
# concurrency control lives on the GitHub side (`concurrency:` keys in
# each workflow), and a single in-cluster runner is enough to serialize
# the per-service pipelines without head-of-line blocking unrelated
# services (each workflow declares a per-service concurrency group).
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: ns-ci
  labels:
    app: github-runner
spec:
  replicas: 1
  strategy:
    type: Recreate   # only one runner at a time owns the registration
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: ci-deployer
      # The runner Pod itself needs to talk to the kube-apiserver via its
      # projected SA token, so automounting is REQUIRED (unlike app pods,
      # which set this to false in Phase C).
      automountServiceAccountToken: true
      containers:
        # -----------------------------------------------------------------
        # Runner container — long-running agent that polls GitHub for jobs.
        # -----------------------------------------------------------------
        - name: runner
          image: myoung34/github-runner:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REPO_URL
              valueFrom:
                secretKeyRef: { name: github-runner, key: RUNNER_REPO_URL }
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef: { name: github-runner, key: RUNNER_TOKEN }
            - name: LABELS
              valueFrom:
                secretKeyRef: { name: github-runner, key: RUNNER_LABELS }
            - name: RUNNER_NAME_PREFIX
              valueFrom:
                secretKeyRef: { name: github-runner, key: RUNNER_NAME_PREFIX }
            # The runner shells out to `docker` for buildx; point it at
            # the DinD sidecar instead of the node's socket. This means
            # the runner container itself does NOT need /var/run/docker.sock,
            # which keeps the node's container runtime out of reach.
            - { name: DOCKER_HOST, value: "tcp://localhost:2375" }
            # Ephemeral: deregisters after each job. Keeps GitHub's runner
            # list clean and means a compromised runner can't keep polling.
            - { name: EPHEMERAL, value: "true" }
            # The image installs kubectl on demand if asked; we bake the
            # path here so the workflows can rely on it.
            - { name: ADDITIONAL_PACKAGES, value: "kubectl curl jq" }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 2,    memory: 4Gi }
          volumeMounts:
            - { name: work,   mountPath: /actions-runner/_work }
            - { name: tmp,    mountPath: /tmp }
          securityContext:
            # The runner image needs to install packages on first boot;
            # full non-root is enforced on app Pods in Phase C but is
            # intentionally relaxed for the CI bootstrap container here.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        # -----------------------------------------------------------------
        # Docker-in-Docker sidecar — exposes a Docker daemon on :2375 for
        # the runner to push images to the in-cluster registry.
        # -----------------------------------------------------------------
        - name: dind
          image: docker:24-dind
          imagePullPolicy: IfNotPresent
          args:
            - "--host=tcp://0.0.0.0:2375"
            # The in-cluster registry runs over plain HTTP (TLS is added
            # only in Phase C). Trust it explicitly here so `docker push`
            # does not refuse the connection.
            - "--insecure-registry=registry.ns-registry.svc.cluster.local:5000"
          env:
            - { name: DOCKER_TLS_CERTDIR, value: "" }
          securityContext:
            # DinD requires privileged to mount overlay/devicemapper.
            # Quarantined to ns-ci by NetworkPolicy in Phase C.
            privileged: true
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 2,    memory: 4Gi }
          volumeMounts:
            - { name: docker-graph, mountPath: /var/lib/docker }
            - { name: work,         mountPath: /actions-runner/_work }
      volumes:
        - { name: work,         emptyDir: {} }
        - { name: tmp,          emptyDir: {} }
        - { name: docker-graph, emptyDir: {} }
