# =====================================================================
# Registration token + repo URL for the self-hosted GitHub Actions
# runner. Bound to the runner Deployment as env vars.
#
# These placeholders MUST be replaced before applying the manifest:
#   * GITHUB_REPO_URL — e.g. https://github.com/<owner>/aircraftsaas_fcc
#   * GITHUB_RUNNER_TOKEN — short-lived registration token issued by
#       the repo's Settings > Actions > Runners > "New self-hosted
#       runner" page (or via the GitHub REST API). The container's
#       entrypoint exchanges it once for a long-lived runner identity
#       persisted on the emptyDir volume.
#
# In Phase C (deploy.md §5.2) this Secret is replaced with a
# SealedSecret committed to Git; for Phase B we keep a plain Secret
# documented as "do not commit real tokens" so the workflow files can
# reference its keys without coupling to the sealed-secrets controller.
# =====================================================================
# pre-commit:allow-plaintext-secret
apiVersion: v1
kind: Secret
metadata:
  name: github-runner
  namespace: ns-ci
type: Opaque
stringData:
  # Replace with the real repo URL.
  RUNNER_REPO_URL: "https://github.com/REPLACE_ME/aircraftsaas_fcc"
  # Replace with a fresh registration token (rotated every 60 min by GitHub).
  RUNNER_TOKEN: "REPLACE_ME"
  # Labels GitHub Actions workflows target via `runs-on:`. Keep these in
  # sync with the `runs-on` values in .github/workflows/*.yaml.
  RUNNER_LABELS: "self-hosted,linux,k8s,aircraft"
  RUNNER_NAME_PREFIX: "k8s-runner"
