# allow-registry
# Allows only registry pulls/pushes from the approved namespaces and DNS egress; no other traffic is permitted.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-registry-ingress, namespace: ns-registry }
spec:
  podSelector: { matchLabels: { app: registry } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { name: ns-users } }
    - namespaceSelector: { matchLabels: { name: ns-fleet } }
    - namespaceSelector: { matchLabels: { name: ns-booking } }
    - namespaceSelector: { matchLabels: { name: ns-frontend } }
    - namespaceSelector: { matchLabels: { name: ns-ci } }
    ports: [{ protocol: TCP, port: 5000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-registry-egress, namespace: ns-registry }
spec:
  podSelector: { matchLabels: { app: registry } }
  policyTypes: [Egress]
  egress:
  # DNS (CoreDNS) — must use the auto-injected
  # kubernetes.io/metadata.name label, because kube-system does NOT have a
  # `name=kube-system` label by default on stock Kubernetes / kubeadm clusters.
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
      podSelector:
        matchLabels: { k8s-app: kube-dns }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
