---
# vue-frontend already runs readOnlyRootFilesystem + non-root since
# Phase A (see k8s/frontend/deployment.yaml). The Phase C patch only
# binds it to the dedicated runtime SA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue-frontend
  namespace: ns-frontend
spec:
  template:
    spec:
      serviceAccountName: vue-frontend-runtime
      automountServiceAccountToken: false
