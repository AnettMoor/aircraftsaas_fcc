# =====================================================================
# fleet-secret — SealedSecret form.
#
# Replaces k8s/fleet/secret.yaml. See k8s/sealed-secrets/README.md
# and users-sealedsecret.yaml for the operator workflow + placeholder
# rationale.
# =====================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: fleet-secret
  namespace: ns-fleet
spec:
  encryptedData:
    ConnectionStrings__FleetConnection: PLACEHOLDER_RESEAL_BEFORE_APPLY
    JWT__Key:                           PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__UserName:                 PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__Password:                 PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: fleet-secret
      namespace: ns-fleet
    type: Opaque
