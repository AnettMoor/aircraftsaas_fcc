# =====================================================================
# Minikube overlay
#
# Mirrors the local.md walkthrough. Defaults already match the base, so
# this overlay is mostly a documented "preset" rather than a heavy patch.
#
# Image strategy: when running entirely offline against a Minikube
# cluster the operator runs `eval $(minikube -p aircraft docker-env)` and
# builds images locally; the existing `<svc>:dev` tags + IfNotPresent
# pull policy on each Deployment are exactly what `local.md` documents.
# =====================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Hostnames already use *.aircraft.localtest.me in the base ingress, which
# resolves to 127.0.0.1 by RFC and works under `minikube tunnel`. No host
# patch is needed here. Replica counts (2) and CPU/memory requests are
# already sized for the 3-node Minikube cluster in local.md.

namespace: ""  # Each resource carries its own namespace; do not rewrite.
