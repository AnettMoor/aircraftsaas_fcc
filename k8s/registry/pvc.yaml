# =====================================================================
# Persistent storage for the in-cluster Docker Registry v2.
#
# ReadWriteOnce is fine because the
# registry runs as a single-replica Deployment (storage layout is not
# crash-safe across concurrent writers - scope!)
# =====================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: ns-registry
spec:
  accessModes: [ReadWriteOnce]
  volumeName: registry-pv
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
