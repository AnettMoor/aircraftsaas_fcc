# =====================================================================
# Bitnami sealed-secrets-controller — Phase C §C.13
#
# Installed into kube-system. The controller watches every namespace
# for `SealedSecret` resources, decrypts them with its private key,
# and materialises the equivalent `Secret` in the same namespace.
#
# This manifest is the minimal, self-contained installation derived
# from the upstream release manifest:
#
#   https://github.com/bitnami-labs/sealed-secrets/releases/tag/v0.26.2
#
# Pinned to v0.26.2 (the latest stable at the time of Phase C). When
# upgrading, regenerate from `kubeseal-controller.yaml` of the new
# release rather than editing this file by hand.
#
# Wired into the base via k8s/sealed-secrets/kustomization.yaml. The
# CRD is bundled here so `kubectl apply -k k8s/base` succeeds in a
# single shot on a fresh cluster.
# =====================================================================
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sealedsecrets.bitnami.com
spec:
  group: bitnami.com
  scope: Namespaced
  names:
    kind: SealedSecret
    listKind: SealedSecretList
    plural: sealedsecrets
    singular: sealedsecret
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    name: sealed-secrets-controller
---
# The controller decrypts SealedSecrets and writes the corresponding
# Secret back into the source namespace. It therefore needs:
#   * `secrets` CRUD in every namespace,
#   * `sealedsecrets` (the CRD above) CRUD in every namespace,
#   * Read access to its own decryption keys (kept as Secrets in
#     kube-system labeled sealedsecrets.bitnami.com/sealed-secrets-key).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-controller
rules:
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets", "sealedsecrets/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets-controller
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: kube-system
---
# Key-rotation Role: scoped to kube-system, lets the controller manage
# its own keypair Secrets WITHOUT granting cluster-wide privilege.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sealed-secrets-key-admin
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "list", "get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-key-admin
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sealed-secrets-key-admin
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-controller
    namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    name: sealed-secrets-controller
spec:
  type: ClusterIP
  selector:
    name: sealed-secrets-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-controller
  namespace: kube-system
  labels:
    name: sealed-secrets-controller
spec:
  replicas: 1
  strategy:
    type: Recreate   # avoid two controllers racing on the same keypair
  selector:
    matchLabels:
      name: sealed-secrets-controller
  template:
    metadata:
      labels:
        name: sealed-secrets-controller
    spec:
      serviceAccountName: sealed-secrets-controller
      # The controller needs the projected SA token to call apiserver;
      # this is one of the rare workloads that legitimately keeps
      # automount on. App workloads explicitly disable it in §C.14.
      automountServiceAccountToken: true
      containers:
        - name: sealed-secrets-controller
          image: docker.io/bitnami/sealed-secrets-controller:v0.26.2
          imagePullPolicy: IfNotPresent
          args:
            - --update-status
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
