# =====================================================================
# Push credentials (htpasswd) for the in-cluster Docker Registry v2.
#
# The registry container mounts this secret at /auth/htpasswd and runs
# in BASIC auth mode (REGISTRY_AUTH=htpasswd, REGISTRY_AUTH_HTPASSWD_*
# env vars wired in deployment.yaml).
#
#
# To regenerate locally:
#   htpasswd -nbB ciuser '<new-pass>' | base64
# and replace `htpasswd:` below.
# =====================================================================
# pre-commit:allow-plaintext-secret
apiVersion: v1
kind: Secret
metadata:
  name: registry-auth
  namespace: ns-registry
type: Opaque
stringData:
  # ciuser : ciuser (bcrypt). Regenerate before any non-local use.
  htpasswd: |
    ciuser:$2y$10$E1Z4MziJ8wG7yJaQpRr/Q.qkXl4cQ8Q5h5jVbqI6h2g3yX1n5sP1S
---
# imagePullSecret consumed by every app namespace's default ServiceAccount
# (patched in by k8s/registry/namespace-pull-secret.yaml). Holds the same
# credentials as registry-auth above, formatted as a Docker config.json
# so kubelet can authenticate when pulling.

apiVersion: v1
kind: Secret
metadata:
  name: local-registry
  namespace: ns-users
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.ns-registry.svc.cluster.local:5000":{"username":"ciuser","password":"ciuser","auth":"Y2l1c2VyOmNpdXNlcg=="}}}
---
