# =====================================================================
# Base Kustomization
#
# This is the "Minikube-equivalent" baseline: replica counts, hostnames
# (*.aircraft.localtest.me), and image tags (`<svc>:dev`) match the manual
# walkthrough in local.md. Overlays under k8s/overlays/* patch this for
# different environments:
#   * overlays/minikube   — explicit Minikube preset (defaults already match)
#   * overlays/opennebula — production hostnames, in-cluster registry images,
#                           replicas=3, anti-affinity
#
# Resources are pulled in via per-component `kustomization.yaml` files
# (not raw paths) so that Kustomize's "no traversal outside root" rule
# is satisfied — every referenced directory IS a Kustomization root.
#
# Apply order matters but Kustomize itself does NOT order resources by
# the `resources:` list. The order below is documentary; runtime
# ordering on the cluster is guaranteed by readiness probes
# (services wait for Postgres/RabbitMQ DNS to resolve and respond).
# =====================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # 1. Namespaces with the `name: ns-xxx` labels NetworkPolicies need.
  - namespaces.yaml

  # 2. In-cluster Docker Registry v2 + imagePullSecret patching of the
  #    default ServiceAccount in every app namespace.
  - ../registry

  # 3. Cluster infrastructure (ns-infra): Postgres + RabbitMQ.
  - ../infra

  # 4. Application workloads.
  - ../users
  - ../fleet
  - ../booking
  - ../frontend

  # 5. Gateway (Ingress objects, one per app namespace).
  - ../gateway

  # 6. CI namespace (self-hosted GitHub Actions runner + ci-deployer RBAC).
  #    Required from Phase B onwards; wired here so a single
  #    `kubectl apply -k k8s/base` (or any overlay) brings up the
  #    runner alongside the workload it deploys.
  - ../ci

  # 7. NetworkPolicies for every app namespace, including the
  #    ns-frontend and ns-registry policies added in Phase C §C.12.
  - ../network-policies

  # 8. Phase C §C.14 — RBAC ships as a Kustomize *Component* under
  #    k8s/rbac/, layered in by each overlay (`components:` section)
  #    so the strategic-merge hardening patch can reach the Deployments
  #    pulled in via this base. Wiring it as a plain `resources:` here
  #    would force the patch to live under k8s/base/ to satisfy
  #    kustomize's path-traversal rule.
