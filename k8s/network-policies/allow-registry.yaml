# =====================================================================
# allow-registry
#
# The in-cluster Docker Registry v2 receives image pulls from the app
# namespaces (kubelet → registry over the Pod network, sourced from the
# Pod's namespace) and image pushes from the CI runner in ns-ci.
#
# Ingress: :5000 from ns-{users,fleet,booking,frontend,ci}.
# Egress:  DNS only. The registry's storage is a PVC mounted into the
#          Pod — it doesn't reach any other service.
#
# Note: ns-ci is intentionally allowed here even though it is itself
# NOT default-denied (see default-deny.yaml comment). The allow rule
# below is what authorises *reverse* traffic landing on the registry
# Pod from the runner — without it the default-deny on ns-registry
# would drop the push.
# =====================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-registry-ingress, namespace: ns-registry }
spec:
  podSelector: { matchLabels: { app: registry } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { name: ns-users } }
    - namespaceSelector: { matchLabels: { name: ns-fleet } }
    - namespaceSelector: { matchLabels: { name: ns-booking } }
    - namespaceSelector: { matchLabels: { name: ns-frontend } }
    - namespaceSelector: { matchLabels: { name: ns-ci } }
    ports: [{ protocol: TCP, port: 5000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-registry-egress, namespace: ns-registry }
spec:
  podSelector: { matchLabels: { app: registry } }
  policyTypes: [Egress]
  egress:
  # DNS (CoreDNS) — must use the auto-injected
  # kubernetes.io/metadata.name label, because kube-system does NOT have a
  # `name=kube-system` label by default on stock Kubernetes / kubeadm clusters.
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: kube-system }
      podSelector:
        matchLabels: { k8s-app: kube-dns }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
