# fleet-secret — SealedSecret form.
# SealedSecret for Fleet service credentials, replacing the plaintext fleet-secret with encrypted database, JWT, and RabbitMQ configuration.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: fleet-secret
  namespace: ns-fleet
spec:
  encryptedData:
    ConnectionStrings__FleetConnection: PLACEHOLDER_RESEAL_BEFORE_APPLY
    JWT__Key:                           PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__UserName:                 PLACEHOLDER_RESEAL_BEFORE_APPLY
    RabbitMQ__Password:                 PLACEHOLDER_RESEAL_BEFORE_APPLY
  template:
    metadata:
      name: fleet-secret
      namespace: ns-fleet
    type: Opaque
