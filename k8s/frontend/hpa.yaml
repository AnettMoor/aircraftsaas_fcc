#vue-frontend HPA.
#
# Static-asset serving is cheap; the HPA is mostly here to honour the
# "scale on demand" requirement 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vue-frontend-hpa
  namespace: ns-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vue-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
