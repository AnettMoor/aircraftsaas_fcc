# pre-commit:allow-plaintext-secret
# =====================================================================
# Phase C §C.13 — bootstrap baseline only.
#
# This plaintext Secret stays in the tree as the FIRST-BOOT credential
# source until the operator runs `scripts/seal-secrets.sh` against a
# real cluster (which fills in the placeholders in
# k8s/sealed-secrets/users-sealedsecret.yaml). Once the SealedSecret
# is sealed and applied, this file is overwritten by the matching
# `kind: Secret` materialised by the controller — the two cannot
# coexist on the cluster because they share name/namespace.
#
# The explicit `# pre-commit:allow-plaintext-secret` marker above
# whitelists this file in:
#   * scripts/git-hooks/pre-commit-no-plaintext-secrets.sh
#   * .github/workflows/ci-security.yaml (plaintext-secret-scan job)
# Remove the marker and the file in the same commit that promotes
# the sealed variant to be the source of truth.
# =====================================================================
apiVersion: v1
kind: Secret
metadata: { name: users-secret, namespace: ns-users }
type: Opaque
stringData:
  ConnectionStrings__UsersConnection: "Host=postgres.ns-infra.svc.cluster.local;Port=5432;Database=aircraft-users;Username=postgres;Password=postgres"
  JWT__Key:           "some_secret_password_dont_share.at.iausdhviushviusdhuisdhgiusdfhliuhdiufvhidufvhidufhviudsfh"
  RabbitMQ__UserName: "guest"
  RabbitMQ__Password: "guest"
