# =====================================================================
# Patches the default ServiceAccount in every app namespace so that the
# `local-registry` imagePullSecret (created in auth-secret.yaml) is used
# automatically by any Pod scheduled into that namespace.
#
# Without this, every Deployment would have to enumerate
# `imagePullSecrets: [{ name: local-registry }]` itself. Patching the
# default ServiceAccount keeps the workload manifests focused on
# application concerns.
#
# Note: the Secret objects themselves are defined in auth-secret.yaml
# (one per app namespace). This file only wires them into the SAs.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ns-users
imagePullSecrets:
  - name: local-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ns-fleet
imagePullSecrets:
  - name: local-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ns-booking
imagePullSecrets:
  - name: local-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ns-frontend
imagePullSecrets:
  - name: local-registry
