# SealedSecrets component: installs the controller and deploys all application SealedSecrets.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - controller.yaml
  - users-sealedsecret.yaml
  - fleet-sealedsecret.yaml
  - booking-sealedsecret.yaml
  - postgres-sealedsecret.yaml
  - registry-auth-sealedsecret.yaml
