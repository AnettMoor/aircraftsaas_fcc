stages:
  - build
  - test
  - deploy

build:
  stage: build
  tags:
    - first
  script:
    - docker build --target build -t aircraft-build -f Dockerfile .

test:
  stage: test
  tags:
    - first
  script:
    - docker build --target test -t aircraft-test -f Dockerfile .

deploy:
  stage: deploy
  only:
    - main
  tags:
    - first
  script:
    - docker compose -p aircraft-backend-clean down --remove-orphans || true
    - docker rm -f postgres-aircraft-clean aircraft-webapp-clean || true
    - docker ps -q --filter "publish=87" | xargs -r docker rm -f || true
    - docker ps -q --filter "publish=7891" | xargs -r docker rm -f || true
    - sleep 2
    - docker compose -p aircraft-backend-clean up --build --remove-orphans --detach
    - sleep 30
    - docker logs aircraft-webapp-clean --tail=200
    - docker ps --filter "name=aircraft"
