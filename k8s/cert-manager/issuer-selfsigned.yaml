# =====================================================================
# Self-signed CA issuer — Phase C §C.15 (Minikube / local).
#
# Two-step bootstrap:
#
#   1. SelfSigned issuer mints a one-time root certificate (the CA).
#   2. A CA issuer reads that root and signs leaf certificates for
#      every Ingress that requests `cluster-issuer: selfsigned-ca-issuer`.
#
# Why two steps: pointing every Ingress directly at a `SelfSigned`
# issuer would generate a *new* root per certificate — the browser
# would have to re-trust every host. Going through a CA issuer gives
# us one root the developer can import into their trust store
# (`mkcert -CAROOT`-style) and have every aircraft.* host trusted.
#
# Storage: the CA's keypair lands in the `selfsigned-ca-key` Secret
# in cert-manager namespace. To pin the CA across `kubectl delete`
# cycles, export the secret to the operator's vault before tearing
# down the namespace.
# =====================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: aircraft-saas-internal-ca
  subject:
    organizations: ["AircraftSaaS"]
  duration: 87600h        # 10 years
  renewBefore: 720h       # 30 days
  secretName: selfsigned-ca-key
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-ca-issuer
spec:
  ca:
    secretName: selfsigned-ca-key
